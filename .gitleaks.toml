title = "Zero-trust lab secret scanning"

[extend]
useDefault = true

[[rules]]
id = "lab-env-credential"
description = "Literal lab credentials in environment files"
path = '''(^|/)\.env(\.[^/]*)?$'''
regex = '''(?im)^\s*(?:export\s+)?(?:DB_PASSWORD|POSTGRES_SUPERUSER_PASSWORD|VAULT_ADMIN_BOOTSTRAP_PASSWORD|VAULT_ROOT_TOKEN|DASHBOARD_PASSWORD)\s*=\s*["']?([A-Za-z0-9_./+=:@!-]{4,})'''
secretGroup = 1

[[rules.allowlists]]
description = "Intentionally fake password in the isolated baseline only"
condition = "AND"
paths = ['''^baseline/\.env\.baseline$''']
regexes = ['''^welcome2024$''']
