# TYPE   DATABASE  USER      ADDRESS      METHOD
# Admin only through the local socket, as the OS user postgres
local    all       postgres               peer
local    all       all                    reject

# The superuser never logs in over the network
hostssl  all       postgres  0.0.0.0/0    reject
hostssl  all       postgres  ::/0         reject

# Everyone else: TLS + SCRAM, only on appdb
hostssl  appdb     all       0.0.0.0/0    scram-sha-256
hostssl  appdb     all       ::/0         scram-sha-256

# Anything else (plain TCP, other databases) is refused
host     all       all       0.0.0.0/0    reject
host     all       all       ::/0         reject
