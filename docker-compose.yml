name: zero-trust

services:
  postgres:
    build: ./postgres
    container_name: zt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: appdb
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_SUPERUSER_PASSWORD}
      VAULT_ADMIN_BOOTSTRAP_PASSWORD: ${VAULT_ADMIN_BOOTSTRAP_PASSWORD}
    command:
      - postgres
      - -c
      - ssl=on
      - -c
      - ssl_cert_file=/etc/postgresql-certs/server.crt
      - -c
      - ssl_key_file=/etc/postgresql-certs/server.key
      - -c
      - hba_file=/config/pg_hba.conf
      - -c
      - password_encryption=scram-sha-256
      - -c
      - shared_preload_libraries=pgaudit
      - -c
      - pgaudit.log=ddl,role,write,read
      - -c
      - log_connections=on
      - -c
      - log_disconnections=on
      - -c
      - "log_line_prefix=%m [%p] user=%u db=%d "
      - -c
      - logging_collector=on
      - -c
      - log_destination=stderr,jsonlog
      - -c
      - log_directory=/var/log/pg
      - -c
      - log_filename=postgresql-%Y-%m-%d.log
      - -c
      - log_file_mode=0640
    volumes:
      - ./certs/server.crt:/certs-src/server.crt:ro
      - ./certs/server.key:/certs-src/server.key:ro
      - ./certs/ca.crt:/certs-src/ca.crt:ro
      - ./postgres/pg_hba.conf:/config/pg_hba.conf:ro
      - ./postgres/init.sql:/sql/init.sql:ro
      - ./postgres/initdb/01-init.sh:/docker-entrypoint-initdb.d/01-init.sh:ro
      - ./postgres/monitor.sql:/sql/monitor.sql:ro
      - ./postgres/initdb/02-monitor.sh:/docker-entrypoint-initdb.d/02-monitor.sh:ro
      - pgdata:/var/lib/postgresql/data
      - pglogs:/var/log/pg
    ports:
      - "127.0.0.1:5432:5432"
    networks:
      - zt
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -d appdb"]
      interval: 5s
      timeout: 3s
      retries: 20

  vault:
    image: hashicorp/vault:2.2.1
    container_name: zt-vault
    restart: "no"
    cap_add:
      - IPC_LOCK
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_ROOT_TOKEN}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      VAULT_ADDR: http://127.0.0.1:8200
    volumes:
      - ./certs/ca.crt:/vault/certs/ca.crt:ro
      - vault-audit:/vault/logs
    ports:
      - "127.0.0.1:8200:8200"
    networks:
      - zt
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "vault", "status"]
      interval: 5s
      timeout: 3s
      retries: 20

  client:
    build: ./app
    profiles: ["client"]
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    environment:
      VAULT_ADDR: http://vault:8200
      PGHOST: postgres
      PGDATABASE: appdb
      PGSSLROOTCERT: /certs/ca.crt
    volumes:
      - ./certs/ca.crt:/certs/ca.crt:ro
    networks:
      - zt

  dashboard:
    build: ./dashboard
    container_name: zt-dashboard
    profiles: ["dashboard"]
    restart: "no"
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    group_add:
      - "999"
    environment:
      VAULT_ADDR: http://vault:8200
      PGHOST: postgres
      PGDATABASE: appdb
      PGSSLROOTCERT: /certs/ca.crt
      LOG_DIR: /var/log/pg
      ROLE_ID: ${DASH_ROLE_ID:-}
      SECRET_ID: ${DASH_SECRET_ID:-}
      DASHBOARD_PASSWORD: ${DASHBOARD_PASSWORD:-}
    volumes:
      - ./certs/ca.crt:/certs/ca.crt:ro
      - pglogs:/var/log/pg:ro
    ports:
      - "127.0.0.1:8080:8080"
    networks:
      - zt
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  pglogs:
  vault-audit:

networks:
  zt:
